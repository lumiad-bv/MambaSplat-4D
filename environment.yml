# conda env create -f environment.yml && conda activate mambasplat
# Then build both Mamba CUDA kernels against this torch (see README).
name: mambasplat
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - git
  - cuda-toolkit==13.0.*
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - torch==2.10.0
      - hydra-core==1.3.2
      - omegaconf==2.3.0
      - numpy
      - tqdm
      - einops
      - timm
      - plyfile
      - pyyaml
      - wandb
